<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43a047"/>
      <stop offset="100%" style="stop-color:#66bb6a"/>
    </linearGradient>
    <linearGradient id="barOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffa600"/>
      <stop offset="100%" style="stop-color:#ffb74d"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="400" height="280" rx="12" fill="#1c1c1e"/>

  <!-- Header -->
  <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="600" fill="#e0e0e0">Proxmox</text>
  <!-- Mode pills -->
  <rect x="280" y="16" width="34" height="16" rx="8" fill="none" stroke="#444" stroke-width="1"/>
  <text x="297" y="27" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">min</text>
  <rect x="318" y="16" width="38" height="16" rx="8" fill="#5c8df6"/>
  <text x="337" y="27" font-family="sans-serif" font-size="9" fill="#fff" text-anchor="middle">norm</text>
  <rect x="360" y="16" width="34" height="16" rx="8" fill="none" stroke="#444" stroke-width="1"/>
  <text x="377" y="27" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">dense</text>

  <!-- Divider -->
  <line x1="20" y1="44" x2="380" y2="44" stroke="#333" stroke-width="1"/>

  <!-- Node header -->
  <text x="20" y="62" font-family="sans-serif" font-size="12" font-weight="600" fill="#e0e0e0">pve</text>
  <text x="360" y="62" font-family="sans-serif" font-size="10" fill="#888" text-anchor="end">up 12d 4h</text>

  <!-- CPU bar -->
  <text x="20" y="82" font-family="sans-serif" font-size="9" fill="#888">CPU</text>
  <rect x="52" y="74" width="300" height="6" rx="3" fill="#2e2e2e"/>
  <rect x="52" y="74" width="111" height="6" rx="3" fill="url(#barGreen)"/>
  <text x="360" y="82" font-family="sans-serif" font-size="10" fill="#ccc" text-anchor="end">37.0%</text>

  <!-- RAM bar -->
  <text x="20" y="102" font-family="sans-serif" font-size="9" fill="#888">RAM</text>
  <rect x="52" y="94" width="300" height="6" rx="3" fill="#2e2e2e"/>
  <rect x="52" y="94" width="219" height="6" rx="3" fill="url(#barOrange)"/>
  <text x="360" y="102" font-family="sans-serif" font-size="10" fill="#ccc" text-anchor="end">73.0%</text>

  <!-- DSK bar -->
  <text x="20" y="122" font-family="sans-serif" font-size="9" fill="#888">DSK</text>
  <rect x="52" y="114" width="300" height="6" rx="3" fill="#2e2e2e"/>
  <rect x="52" y="114" width="126" height="6" rx="3" fill="url(#barGreen)"/>
  <text x="360" y="122" font-family="sans-serif" font-size="10" fill="#ccc" text-anchor="end">420 GiB</text>

  <!-- Network -->
  <text x="20" y="142" font-family="sans-serif" font-size="10" fill="#888">↑ 12.4 MB/s</text>
  <text x="120" y="142" font-family="sans-serif" font-size="10" fill="#888">↓ 8.1 MB/s</text>

  <!-- VMs section label -->
  <text x="20" y="164" font-family="sans-serif" font-size="9" font-weight="500" fill="#666" letter-spacing="1">VMS &amp; CONTAINERS</text>

  <!-- VM rows -->
  <!-- ubuntu -->
  <circle cx="28" cy="180" r="4" fill="#43a047"/>
  <text x="40" y="184" font-family="sans-serif" font-size="11" fill="#e0e0e0">ubuntu</text>
  <rect x="192" y="172" width="22" height="14" rx="3" fill="#2e2e2e"/>
  <text x="203" y="182" font-family="sans-serif" font-size="8" fill="#888" text-anchor="middle">VM</text>
  <text x="308" y="184" font-family="sans-serif" font-size="10" fill="#888" text-anchor="end">12.3%</text>
  <text x="360" y="184" font-family="sans-serif" font-size="10" fill="#888" text-anchor="end">45.1%</text>

  <!-- homeassistant -->
  <circle cx="28" cy="202" r="4" fill="#43a047"/>
  <text x="40" y="206" font-family="sans-serif" font-size="11" fill="#e0e0e0">homeassistant</text>
  <rect x="192" y="194" width="20" height="14" rx="3" fill="#2e2e2e"/>
  <text x="202" y="204" font-family="sans-serif" font-size="8" fill="#888" text-anchor="middle">CT</text>
  <text x="308" y="206" font-family="sans-serif" font-size="10" fill="#888" text-anchor="end">4.1%</text>
  <text x="360" y="206" font-family="sans-serif" font-size="10" fill="#888" text-anchor="end">31.7%</text>

  <!-- pihole -->
  <circle cx="28" cy="224" r="4" fill="#9e9e9e"/>
  <text x="40" y="228" font-family="sans-serif" font-size="11" fill="#888">pihole</text>
  <rect x="192" y="216" width="20" height="14" rx="3" fill="#2e2e2e"/>
  <text x="202" y="226" font-family="sans-serif" font-size="8" fill="#888" text-anchor="middle">CT</text>
  <text x="308" y="228" font-family="sans-serif" font-size="10" fill="#666" text-anchor="end">—</text>
  <text x="360" y="228" font-family="sans-serif" font-size="10" fill="#666" text-anchor="end">—</text>

  <!-- Footer label -->
  <text x="200" y="268" font-family="sans-serif" font-size="9" fill="#555" text-anchor="middle">Proxmox Card for Home Assistant</text>
</svg>
